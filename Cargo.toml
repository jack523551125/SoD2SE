[workspace]
resolver = "2"
members = ["Rust/abi", "Rust/sdk", "Rust/services", "Rust/game-api", "Rust/runtime", "Rust/loader", "Rust/devtools", "Rust/example"]

[workspace.package]
version = "0.7.0-preview.1"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
sod2se-abi = { path = "Rust/abi" }
sod2se-sdk = { path = "Rust/sdk" }
sod2se-services = { path = "Rust/services" }
sod2se-game-api = { path = "Rust/game-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }

[profile.release]
panic = "unwind"
lto = "thin"

