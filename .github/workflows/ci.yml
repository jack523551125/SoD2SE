name: SoD2SE offline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: Projects/SoD2SE
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install the pinned packaging-test dependency
        shell: pwsh
        run: python -m pip install -r Projects/SoD2SE/Automation/Test/requirements.txt
      - name: Run SoD2SE-owned test entrypoint
        shell: pwsh
        run: pwsh -NoProfile -File Projects/SoD2SE/Automation/Test/test.ps1
