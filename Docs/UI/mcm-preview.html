<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>MCM visual specification</title><style>
*{box-sizing:border-box}body{margin:0;background:#181613;color:#eee9dc;font-family:"Segoe UI","Microsoft YaHei",sans-serif}nav{padding:20px;position:sticky;top:0;background:#252019;z-index:2}nav button{padding:10px 16px;margin:4px;color:#eee;background:#493927;border:1px solid #9d754e;cursor:pointer}main{margin:30px auto;width:1400px;background:#12110f;box-shadow:0 12px 60px #0009}header{background:#9e4615;padding:22px 32px;font-size:32px;display:flex;justify-content:space-between}.grid{display:grid;grid-template-columns:360px 1fr;gap:32px;padding:32px;min-height:650px}aside{background:#201b15;padding:12px}aside div{padding:22px 18px;font-size:24px;margin:6px 0}.selected{border-left:5px solid #f58a37;background:#573d27}.focused{outline:3px solid #ffd297;outline-offset:-3px}h1{font-size:28px;margin:0 0 14px}p{font-size:20px;line-height:1.5;color:#c5bdad}.state{font-size:20px;color:#bed4aa}.row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:18px 20px;background:#29231b;font-size:24px;min-height:76px}.control{display:flex;align-items:center;gap:18px}.control b{padding:8px 18px;background:#65482c;border:1px solid #d79759;min-width:90px;text-align:center}.details{margin-top:32px;border-top:1px solid #665442;padding-top:18px;min-height:135px}.error{color:#ffb1a0}.empty{padding:36px 0;font-size:24px}footer{display:flex;justify-content:space-between;padding:24px 32px;border-top:1px solid #655442;font-size:20px}.badge{border:1px solid #b88445;padding:3px 8px}.note{font-size:16px;padding:20px;color:#b5ac9c}</style>
<nav><b>静态设计稿 · 非游戏截图</b> <button onclick="show('zh')">中文</button><button onclick="show('en')">English</button><button onclick="show('xbox')">Xbox 焦点</button><button onclick="show('empty')">无参数</button><button onclick="show('long')">长文本</button><button onclick="show('error')">保存失败</button></nav>
<main><header><span id="title"></span><span>×</span></header><div class="grid"><aside id="mods"></aside><section><h1 id="name"></h1><div class="state" id="state"></div><p id="description"></p><div id="rows"></div><div class="details"><b id="detailtitle"></b><p id="detail"></p></div></section></div><footer><span id="a"></span><span id="b"></span><span id="c"></span></footer><div class="note">基准画布 1920×1080；面板 1400×880。字号 32/28/24/20；说明与提示不小于 20。橙色侧标表示所选 Mod，描边表示输入焦点。普通、选中、焦点、禁用和错误各有独立样式。</div></main>
<script>function show(mode){const en=mode==='en';document.getElementById("title").textContent=en?'Mod Settings':'Mod 设置';document.getElementById("mods").innerHTML='<div class="selected">'+(en?'Developer example':'开发测试示例')+'</div><div>'+(en?'Unlimited Followers':'无限随从')+'</div>';document.getElementById("name").textContent=mode==='empty'?'无限随从':mode==='long'?'包含较长名称的示例 Mod：完整名称在此显示':en?'Developer example':'开发测试示例';document.getElementById("state").textContent=en?'✓ Loaded · v0.7.0':'✓ 已加载 · v0.7.0';document.getElementById("description").textContent=en?'Configure this Mod. Changes save immediately.':'修改后即时保存；需重启的参数会单独标记。';document.getElementById("rows").innerHTML=mode==='empty'?'<div class="empty">此 Mod 没有可调参数。</div>':'<div class="row '+(mode==='xbox'?'focused':'')+'"><span>'+(en?'Enable feature':'启用功能')+'</span><div class="control"><b>'+(en?'On':'开启')+'</b></div></div><div class="row"><span>'+(en?'Example value':'示例数值')+'</span><div class="control"><b>−</b><span>5</span><b>+</b></div></div>';document.getElementById("detailtitle").textContent=en?'Setting details':'参数说明';document.getElementById("detail").className=mode==='error'?'error':'';document.getElementById("detail").textContent=mode==='error'?'保存失败，已恢复原来的值。可重试；不会把失败显示成已保存。':mode==='long'?'较长说明在固定详情区域换行，超出时可以滚动阅读；不通过压缩字号容纳文字。实验性与危险参数必须显示文字标记，危险修改需要独立确认。':mode==='empty'?'通过安装或 MO2 选择控制此 Mod；这里显示加载状态。':en?'Range: 0–10 · Default: 5. Restore this setting’s default.':'范围：0–10 · 默认值：5　恢复此项默认值';document.getElementById("a").textContent=mode==='xbox'?'方向键／摇杆：选择':en?'↑↓ Select':'↑↓ 选择';document.getElementById("b").textContent=mode==='xbox'?'A 进入／切换 · ←→ 调节':en?'Confirm / adjust':'确认／切换 · ←→ 调节';document.getElementById("c").textContent=mode==='xbox'?'B 返回':en?'Back / close':'返回／关闭';}show(location.hash.slice(1)||'zh')</script></html>
